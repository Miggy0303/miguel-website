<section class="page"><h2 class="section-title">Let's Connect</h2><div class="contact-container">
<p style="font-size:1.1rem;color:var(--muted)">Whether it's a collaboration, a question, or a simple hello, I'd love to hear from you.</p>
<form class="contact-form" id="contactForm">
<div class="form-group"><label for="name">Your Name</label><input type="text" id="name" placeholder="e.g. Jane Doe" required></div>
<div class="form-group"><label for="email">Your Email</label><input type="email" id="email" placeholder="e.g. jane@example.com" required></div>
<div class="form-group"><label for="subject">Subject</label><input type="text" id="subject" placeholder="Project Inquiry" required></div>
<div class="form-group"><label for="message">Message</label><textarea id="message" placeholder="Tell me about your project or inquiry..." required></textarea></div>
<button type="submit" class="submit-btn">Send Message</button></form>
<div class="contact-info"><a href="mailto:miguel.hernandez@email.com">📧 miguel.hernandez@email.com</a><br><a href="#">💻 GitHub</a><a href="#">🔗 LinkedIn</a><a href="#">📸 Instagram</a></div></div></section>
